<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>雨傘王 Marketing OS Clean V1</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">
<aside><div class="logo">雨傘王 Marketing OS</div><div class="tag">CLEAN V1</div>
<nav><button class="active" data-page="dashboard">首頁</button><button data-page="projects">專案管理</button><button data-page="updates">最新回覆 <span id="updateDot" class="dot hidden"></span></button></nav></aside>
<main>
<section id="dashboard" class="page active"><h1>首頁</h1><p class="sub">先驗證 Email 對接核心流程。</p>
<div class="cards"><div class="card"><span>專案總數</span><strong id="statTotal">0</strong></div><div class="card"><span>進行中</span><strong id="statDoing">0</strong></div><div class="card"><span>等待回覆</span><strong id="statWaiting">0</strong></div><div class="card"><span>已完成</span><strong id="statDone">0</strong></div></div></section>
<section id="projects" class="page"><div class="page-head"><div><h1>專案管理</h1><p class="sub">新增專案、子任務與 Email 對接。</p></div><button class="primary" id="newProjectBtn">＋ 新增專案</button></div><div id="projectList" class="project-list"></div></section>
<section id="updates" class="page"><div class="page-head"><div><h1>最新回覆</h1><p class="sub">Google Sheet 同步回來的進度與留言。</p></div><button class="secondary" id="syncBtn">↻ 同步回覆</button></div><div id="updateList"></div></section>
</main></div>
<div id="restrictedApp" class="restricted hidden"><div class="restricted-wrap"><div class="notice"><b>對接人受限模式</b><br>你只能填寫被指派的欄位。</div><div id="restrictedContent" class="card">正在載入邀請資料…</div></div></div>
<dialog id="projectDialog"><form method="dialog" id="projectForm"><h2>新增專案</h2><label>專案名稱<input id="projectName" required></label><label>類型<input id="projectType" placeholder="商品頁／月度圖文／拍攝／門市"></label><label>截止日期<input id="projectDue" type="date"></label><label>子任務（每行一項）<textarea id="projectTasks" placeholder="主圖設計&#10;文案確認&#10;上架"></textarea></label><div class="dialog-actions"><button value="cancel">取消</button><button class="primary" id="saveProjectBtn" value="default">儲存</button></div></form></dialog>
<dialog id="inviteDialog"><form method="dialog" id="inviteForm"><h2>新增 Email 對接</h2><div id="apiStatus" class="api-status">API：檢查中…</div><label>對接 Email<input id="inviteEmail" type="email" required></label><label>指派範圍<select id="inviteTarget"></select></label><fieldset><legend>允許對方填寫</legend><label><input id="permProgress" type="checkbox" checked>進度</label><label><input id="permStatus" type="checkbox" checked>狀態</label><label><input id="permDue" type="checkbox" checked>完成日</label><label><input id="permMessage" type="checkbox" checked>50 字留言</label><label><input id="permResult" type="checkbox">成果連結</label></fieldset><div class="dialog-actions"><button value="cancel">取消</button><button class="primary" id="sendInviteBtn" value="default">寄送邀請</button></div></form></dialog>
<script src="app.js"></script></body></html>
